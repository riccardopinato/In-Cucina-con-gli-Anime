name: F3G artwork materialize

on:
  push:
    branches:
      - f3g-artwork-21-50
    paths:
      - '.github/workflows/f3g-artwork-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile canonical catalog
        run: python3 tool/compile_recipe_catalog.py

      - name: Validate canonical catalog
        run: python3 tool/validate_recipe_catalog.py

      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog/
          if ! git diff --cached --quiet; then
            git commit -m "ci: materialize F3G artwork runtime"
            git push origin HEAD:f3g-artwork-21-50
          fi
