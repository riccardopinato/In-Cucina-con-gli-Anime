name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-kitchen-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-recipe-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned artwork optimizer
        run: python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Optimize canonical recipe artwork
        run: python3 tool/optimize_recipe_artwork.py --write

      - name: Materialize runtime catalog
        run: python3 tool/compile_recipe_catalog.py

      - name: Validate materialized recipe catalog
        run: python3 tool/validate_recipe_catalog.py

      - name: Upload materialized recipe content
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-content-materialized
          path: |
            assets/recipe_artwork/
            assets/catalog/
          if-no-files-found: error
          retention-days: 7

      - name: Check recipe-content materialization drift
        run: git diff --exit-code -- assets/recipe_artwork assets/catalog

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Configure persistent Android signing when available
        id: android_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          values=(
            "${ANDROID_KEYSTORE_BASE64:-}"
            "${ANDROID_KEYSTORE_PASSWORD:-}"
            "${ANDROID_KEY_ALIAS:-}"
            "${ANDROID_KEY_PASSWORD:-}"
          )

          present=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then
              present=$((present + 1))
            fi
          done

          if [ "$present" -eq 0 ]; then
            echo "mode=ephemeral-debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent Android signing is not configured. This APK may require uninstall before a later build."
            exit 0
          fi

          if [ "$present" -ne 4 ]; then
            echo "::error::Persistent Android signing is only partially configured. Set all four ANDROID_* signing secrets."
            exit 1
          fi

          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .signing/animekitchen-release.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../../.signing/animekitchen-release.jks
          EOF

          echo "mode=persistent" >> "$GITHUB_OUTPUT"
          echo "Persistent Android signing configured."

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate repository structure
        run: python3 tool/validate_structure.py

      - name: Validate F3K Italian baseline
        run: python3 tool/f3k_it_quality_gate.py

      - name: Check generated recipe catalog
        run: python3 tool/compile_recipe_catalog.py --check --report build/authoring/production_report.json

      - name: Test recipe authoring pipeline
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py'

      - name: Validate recipe catalog
        run: python3 tool/validate_recipe_catalog.py

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate launcher icons
        run: dart run launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test Flutter
        run: flutter test

      - name: Build synthetic recipe Web preview
        run: python3 tool/build_recipe_preview.py

      - name: Build production Web release
        run: flutter build web --release --base-href "/In-Cucina-con-gli-Anime/"

      - name: Build Android ARM64 internal gate
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --tree-shake-icons \
            --build-number="$GITHUB_RUN_NUMBER"
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Record Android APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          mkdir -p build/android-identity
          {
            echo "source_sha=$GITHUB_SHA"
            echo "workflow_run_number=$GITHUB_RUN_NUMBER"
            echo "signing_mode=${{ steps.android_signing.outputs.mode }}"
            "$APKSIGNER" verify --print-certs "$APK" 2>&1
          } | tee build/android-identity/identity.txt

      - name: Upload Android ARM64 internal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: in-cucina-con-gli-anime-arm64-${{ steps.android_signing.outputs.mode }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android identity report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: in-cucina-con-gli-anime-android-identity
          path: build/android-identity/identity.txt
          if-no-files-found: error
          retention-days: 30
