name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-kitchen-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-recipe-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned artwork optimizer
        run: python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Optimize canonical recipe artwork
        run: python3 tool/optimize_recipe_artwork.py --write

      - name: Materialize runtime catalog
        run: python3 tool/compile_recipe_catalog.py

      - name: Validate materialized recipe catalog
        run: python3 tool/validate_recipe_catalog.py

      - name: Upload materialized recipe content
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-content-materialized
          path: |
            assets/recipe_artwork/
            assets/catalog/
          if-no-files-found: error
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate repository structure
        run: python3 tool/validate_structure.py

      - name: Check generated recipe catalog
        run: python3 tool/compile_recipe_catalog.py --check --report build/authoring/production_report.json

      - name: Test recipe authoring pipeline
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py'

      - name: Validate recipe catalog
        run: python3 tool/validate_recipe_catalog.py

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate launcher icons
        run: dart run launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test Flutter
        run: flutter test

      - name: Build synthetic recipe Web preview
        run: python3 tool/build_recipe_preview.py

      - name: Build production Web release
        run: flutter build web --release --base-href "/In-Cucina-con-gli-Anime/"

      - name: Build Android ARM64 internal gate
        if: github.event_name != 'pull_request' || github.head_ref == 'f3d-recipe-artwork-pilot'
        run: |
          flutter build apk --release --split-per-abi --tree-shake-icons
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload Android ARM64 internal APK
        if: github.event_name != 'pull_request' || github.head_ref == 'f3d-recipe-artwork-pilot'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: in-cucina-con-gli-anime-arm64-internal
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
