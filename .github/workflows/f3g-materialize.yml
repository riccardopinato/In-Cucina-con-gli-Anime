name: F3G materialize catalog

on:
  push:
    branches:
      - f3g-implementation
    paths:
      - 'authoring/**'
      - 'tool/**'
      - '.github/workflows/f3g-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile F3G catalog
        shell: bash
        run: |
          mkdir -p build/authoring build/f3g-runtime
          set +e
          python3 tool/compile_recipe_catalog.py
          status=$?
          set -e
          echo "$status" > build/f3g-status.txt
          if [ -d assets/catalog ]; then
            cp -R assets/catalog/. build/f3g-runtime/
          fi
          exit 0

      - name: Commit materialized runtime and report
        shell: bash
        run: |
          if [ -f build/authoring/recipe_authoring_report.json ]; then
            cp build/authoring/recipe_authoring_report.json docs/_F3G_TMP_REPORT.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_F3G_TMP_REPORT.json 2>/dev/null || true
          if [ "$(cat build/f3g-status.txt)" = "0" ]; then
            git add assets/catalog/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ci: materialize F3G catalog evidence"
            git push origin HEAD:f3g-implementation
          fi

      - name: Upload F3G materialization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f3g-materialized-catalog
          path: |
            build/authoring/recipe_authoring_report.json
            build/f3g-status.txt
            build/f3g-runtime/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce compiler result
        shell: bash
        run: |
          test "$(cat build/f3g-status.txt)" = "0"
