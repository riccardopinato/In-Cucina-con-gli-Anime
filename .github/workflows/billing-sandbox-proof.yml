name: Billing sandbox proof APK

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/core/monetization/**"
      - "lib/features/settings/**"
      - "lib/l10n/**"
      - "pubspec.yaml"
      - ".github/workflows/billing-sandbox-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-kitchen-billing-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: ./tool/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android billing sandbox debug APK
        run: |
          flutter build apk --debug \
            --dart-define=ANIME_KITCHEN_BILLING_ENABLED=true \
            --dart-define=ANIME_KITCHEN_BILLING_SANDBOX=true \
            --dart-define=ANIME_KITCHEN_LIFETIME_PRODUCT_ID=remove_ads_lifetime
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload billing sandbox APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anime-kitchen-billing-sandbox-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
