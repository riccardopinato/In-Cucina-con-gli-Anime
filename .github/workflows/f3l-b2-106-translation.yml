name: F3L B2 106 Italian descriptions MT staging (non-publishable)
on:
  pull_request:
    paths:
      - 'tool/f3l_b2_translate_remaining_106.py'
      - '.github/workflows/f3l-b2-106-translation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate-remaining-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        locale: [en, es, fr, de, pt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install CPU-only translation toolchain
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install --disable-pip-version-check 'transformers==4.48.3' 'sentencepiece==0.2.0' 'sacremoses==0.1.1'
      - name: Generate review-only 106-description machine translation ledger
        run: |
          python tool/f3l_b2_translate_remaining_106.py --locale "${{ matrix.locale }}"
