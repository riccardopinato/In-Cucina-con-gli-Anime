name: F3H install regenerated artwork

on:
  push:
    branches:
      - f3h-editorial-hardening
    paths:
      - .github/workflows/f3h-install-artwork.yml

permissions:
  contents: write

jobs:
  install:
    if: "${{ github.event.head_commit.message == 'ci: install F3H regenerated artwork' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f3h-editorial-hardening
          fetch-depth: 0

      - name: Download approved F3H artwork
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://at.adobe.com/kubrrn8pYKBOSClE' -o assets/recipe_artwork/recipe_000003.jpg
          curl -fL 'https://at.adobe.com/8N9hj9qj8XF5Olqo' -o assets/recipe_artwork/recipe_000009.jpg
          curl -fL 'https://at.adobe.com/r7642ZwObh3NwxHQ' -o assets/recipe_artwork/recipe_000010.jpg
          curl -fL 'https://at.adobe.com/SH88SqbECaCpb2MS' -o assets/recipe_artwork/recipe_000021.jpg
          curl -fL 'https://at.adobe.com/dBnaU5Ox5BRonQZX' -o assets/recipe_artwork/recipe_000030.jpg
          curl -fL 'https://at.adobe.com/kfozkcnmSSGfP23A' -o assets/recipe_artwork/recipe_000035.jpg
          curl -fL 'https://at.adobe.com/UdGSTkuBhWx7FZZz' -o assets/recipe_artwork/recipe_000036.jpg
          curl -fL 'https://at.adobe.com/iu3jlgWeEhISNh6l' -o assets/recipe_artwork/recipe_000037.jpg
          curl -fL 'https://at.adobe.com/137kzFr94lJ7Dd8Q' -o assets/recipe_artwork/recipe_000041.jpg
          curl -fL 'https://at.adobe.com/B2FxPPIwiHdrG9kC' -o assets/recipe_artwork/recipe_000042.jpg
          curl -fL 'https://at.adobe.com/iaxhSssx75rmpdEB' -o assets/recipe_artwork/recipe_000047.jpg
          curl -fL 'https://at.adobe.com/PIOHduFv3YbriD0B' -o assets/recipe_artwork/recipe_000048.jpg
          curl -fL 'https://at.adobe.com/JV6dQYKBT8KsVxS2' -o assets/recipe_artwork/recipe_000050.jpg

      - name: Re-materialize catalog
        run: python3 tool/compile_recipe_catalog.py

      - name: Validate artwork and catalog
        run: |
          python3 tool/validate_structure.py
          python3 tool/compile_recipe_catalog.py --check
          python3 tool/validate_recipe_catalog.py

      - name: Commit regenerated artwork and catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/recipe_artwork assets/catalog
          git diff --cached --quiet && { echo 'No changes staged'; exit 1; }
          git commit -m 'F3H: install regenerated recipe artwork'
          git push origin HEAD:f3h-editorial-hardening
