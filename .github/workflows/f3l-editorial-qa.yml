name: F3L editorial staging audit (non-publishable)
on:
  pull_request:
    paths:
      - 'tool/f3l_*'
      - 'authoring/f3k_it_hardening_51_162.json'
      - 'tool/tests/test_f3l_*'
      - 'authoring/f3l_review_drafts/**'
      - 'docs/f3l_editorial/**'
      - '.github/workflows/f3l-editorial-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-review-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Regression tests
        run: python -m unittest discover -s tool/tests -p 'test_f3l*.py' -q
      - name: Check all five source-bound quarantined recipe packs
        run: python tool/f3l_check_review_drafts.py
      - name: Reject witnessed semantic mistranslations and unsafe source drift
        run: python tool/f3l_semantic_safety_gate.py
      - name: Generate source-locked reviewer dossiers (non-publishable)
        run: python tool/f3l_b2_review_dossiers.py --out-dir build/f3l-b2-review
      - name: Upload bilingual review material (not app content)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f3l-b2-review-dossiers
          path: build/f3l-b2-review/
          if-no-files-found: error
          retention-days: 14
