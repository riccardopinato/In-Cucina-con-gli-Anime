name: R1 Quality Engine v2 — autonomous read-only scan

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'authoring/**'
      - '.github/workflows/**'
      - '.quality-engine-v2.json'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/**'
      - 'authoring/**'
      - '.github/workflows/**'
      - '.quality-engine-v2.json'
  schedule:
    # Best-effort GitHub scheduler; a 24/7 resident process is not implied.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: observe-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [code, content, workflows]
    steps:
      - name: Checkout immutable event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Independent read-only quality scan
        run: |
          python3 tool/quality_engine_v2.py \
            --config .quality-engine-v2.json \
            --mode "${{ matrix.mode }}" \
            --source-sha "$GITHUB_SHA" \
            --output "build/quality-v2/${{ matrix.mode }}.json"

      - name: Upload inspectable audit report (no source snippets)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-v2-${{ matrix.mode }}
          path: build/quality-v2/${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 14
