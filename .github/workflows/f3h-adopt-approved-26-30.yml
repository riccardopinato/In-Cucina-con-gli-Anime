name: F3H adopt approved artwork 26-30

on:
  push:
    branches:
      - f3h-editorial-hardening
    paths:
      - .github/workflows/f3h-adopt-approved-26-30.yml

permissions:
  contents: write

jobs:
  adopt:
    if: "${{ github.event.head_commit.message == 'ci: adopt approved artwork 26-30' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f3h-editorial-hardening
          fetch-depth: 0

      - name: Install user-approved artwork 26-30
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://at.adobe.com/UCREi33LjejxR3aD' -o assets/recipe_artwork/recipe_000026.jpg
          curl -fL 'https://at.adobe.com/W7flrVZam3j1NkzI' -o assets/recipe_artwork/recipe_000027.jpg
          curl -fL 'https://at.adobe.com/LBiqM6GcnH67wKhX' -o assets/recipe_artwork/recipe_000028.jpg
          curl -fL 'https://at.adobe.com/7F9aKgEJGa6wet3k' -o assets/recipe_artwork/recipe_000029.jpg
          curl -fL 'https://at.adobe.com/ZAMINSTc8Dtsk6fP' -o assets/recipe_artwork/recipe_000030.jpg

      - name: Verify image contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for n in range(26, 31):
              p = Path(f"assets/recipe_artwork/recipe_{n:06d}.jpg")
              data = p.read_bytes()
              size = len(data)
              if size > 133120:
                  raise SystemExit(f"{p}: {size} bytes exceeds target budget")
              if not data.startswith(b"\\xff\\xd8\\xff") or not data.endswith(b"\\xff\\xd9"):
                  raise SystemExit(f"{p}: invalid JPEG signature")
              print(f"OK {p} {size} bytes")
          PY

      - name: Re-materialize and validate catalog
        run: |
          python3 tool/compile_recipe_catalog.py
          python3 tool/validate_structure.py
          python3 tool/compile_recipe_catalog.py --check
          python3 tool/validate_recipe_catalog.py

      - name: Commit approved artwork and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/f3h-adopt-approved-26-30.yml
          git add assets/recipe_artwork assets/catalog
          git diff --cached --quiet && { echo 'No changes staged'; exit 1; }
          git commit -m 'F3H: adopt approved artwork 26-30'
          git push origin HEAD:f3h-editorial-hardening
