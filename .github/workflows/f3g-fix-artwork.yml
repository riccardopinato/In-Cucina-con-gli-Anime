name: Fix F3G artwork 30 47

on:
  push:
    branches:
      - f3g-artwork-21-50
    paths:
      - '.github/workflows/f3g-fix-artwork.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pillow
        run: python3 -m pip install --user Pillow==11.3.0

      - name: Generate valid semantic artwork
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          import math, random

          random.seed(47)
          root = Path("assets/recipe_artwork")
          root.mkdir(parents=True, exist_ok=True)
          W = H = 720

          def bg():
              img = Image.new("RGB", (W, H), (103, 60, 34))
              px = img.load()
              for y in range(H):
                  for x in range(W):
                      wave = int(8 * math.sin(y / 37.0))
                      grain = random.randint(-5, 5)
                      px[x, y] = (
                          max(45, min(145, 112 + wave + grain)),
                          max(25, min(105, 66 + wave // 2 + grain)),
                          max(15, min(75, 38 + grain)),
                      )
              return img.filter(ImageFilter.GaussianBlur(0.6))

          # recipe_000030 — Japanese Strawberry Shortcake
          img = bg()
          d = ImageDraw.Draw(img)
          d.ellipse((75, 465, 650, 665), fill=(246, 240, 227), outline=(190, 174, 151), width=5)
          d.ellipse((105, 488, 620, 635), fill=(255, 252, 244), outline=(220, 209, 190), width=3)
          d.rounded_rectangle((205, 245, 520, 530), 22, fill=(91, 48, 28))
          layers = [
              ((210, 250, 515, 330), (247, 213, 150)),
              ((210, 330, 515, 382), (255, 250, 242)),
              ((210, 382, 515, 458), (244, 205, 139)),
              ((210, 458, 515, 508), (255, 250, 242)),
          ]
          for box, col in layers:
              d.rounded_rectangle(box, 10, fill=col)
          for cx in (258, 342, 426, 490):
              d.ellipse((cx-18, 343, cx+18, 375), fill=(208, 49, 59), outline=(142, 24, 34), width=2)
              d.line((cx, 348, cx, 369), fill=(255, 190, 180), width=3)
          d.rounded_rectangle((190, 220, 540, 277), 25, fill=(255, 253, 247), outline=(240, 232, 220), width=2)
          for cx, cy, s in ((260, 210, 1.0), (360, 184, 1.15), (465, 211, 1.0)):
              rx, ry = int(31*s), int(41*s)
              d.polygon([(cx,cy-ry),(cx-rx,cy-4),(cx-18,cy+ry),(cx+18,cy+ry),(cx+rx,cy-4)], fill=(216, 39, 50))
              for sx, sy in ((cx-11,cy-9),(cx+11,cy-6),(cx,cy+8),(cx-8,cy+21),(cx+9,cy+20)):
                  d.ellipse((sx-2,sy-2,sx+2,sy+2), fill=(255, 224, 125))
              d.polygon([(cx,cy-ry+7),(cx-18,cy-ry-5),(cx-7,cy-ry+17)], fill=(48, 128, 61))
              d.polygon([(cx,cy-ry+7),(cx+18,cy-ry-5),(cx+7,cy-ry+17)], fill=(48, 128, 61))
          for cx in (220, 315, 405, 505):
              d.ellipse((cx-18, 239, cx+18, 271), fill=(255,255,250))
          img.save(root / "recipe_000030.jpg", "JPEG", quality=68, optimize=True, subsampling=2)

          # recipe_000047 — Sanshoku Soboro Don
          img = bg()
          d = ImageDraw.Draw(img)
          d.ellipse((75, 520, 650, 690), fill=(44, 23, 15))
          d.ellipse((80, 315, 650, 625), fill=(52, 79, 101), outline=(24, 37, 49), width=7)
          d.ellipse((103, 330, 627, 570), fill=(248, 242, 224), outline=(183, 169, 144), width=4)
          d.ellipse((120, 348, 610, 555), fill=(252, 248, 235))
          for _ in range(130):
              x, y = random.randint(145, 300), random.randint(372, 510)
              if ((x-365)/245)**2 + ((y-450)/105)**2 > 1: continue
              r = random.randint(5, 10)
              col = random.choice(((130,74,34),(151,87,38),(169,98,43),(116,64,31)))
              d.ellipse((x-r,y-r,x+r,y+r), fill=col)
          for _ in range(105):
              x, y = random.randint(300, 440), random.randint(365, 515)
              if ((x-365)/245)**2 + ((y-450)/105)**2 > 1: continue
              rx, ry = random.randint(6, 13), random.randint(4, 9)
              col = random.choice(((246,191,55),(255,211,69),(239,173,36)))
              d.ellipse((x-rx,y-ry,x+rx,y+ry), fill=col)
          for _ in range(50):
              x, y = random.randint(445, 575), random.randint(380, 500)
              if ((x-365)/245)**2 + ((y-450)/105)**2 > 1: continue
              r = random.randint(7, 12)
              d.ellipse((x-r,y-r,x+r,y+r), fill=(62,145,69), outline=(34,92,40), width=1)
              d.ellipse((x-r+3,y-r+3,x-r+6,y-r+6), fill=(155,222,144))
          d.polygon([(354,350),(366,340),(378,350),(365,510)], fill=(252,249,234))
          d.arc((110,400,620,620), 10, 170, fill=(105,151,180), width=5)
          for _ in range(18):
              x, y = random.randint(210,520), random.randint(345,390)
              d.ellipse((x-6,y-4,x+6,y+4), fill=(54,138,65), outline=(30,90,40))
          img.save(root / "recipe_000047.jpg", "JPEG", quality=68, optimize=True, subsampling=2)

          for name in ("recipe_000030.jpg", "recipe_000047.jpg"):
              p = root / name
              with Image.open(p) as im:
                  assert im.size == (720,720)
                  assert im.format == "JPEG"
              assert p.stat().st_size < 143360
              print(name, p.stat().st_size)
          PY

      - name: Commit corrected artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recipe_artwork/recipe_000030.jpg assets/recipe_artwork/recipe_000047.jpg
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate valid artwork 30 and 47"
            git push origin HEAD:f3g-artwork-21-50
          fi
