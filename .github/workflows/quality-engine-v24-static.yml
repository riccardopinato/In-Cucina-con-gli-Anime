name: Quality Engine v2.4-A — portable source audit

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/quality_engine_v24_static.py'
      - 'tool/tests/test_quality_engine_v24_static.py'
      - '.quality-engine-v24.json'
      - '.github/workflows/quality-engine-v24-static.yml'
      - 'tool/quality_engine_v24b_official.py'
      - 'tool/tests/test_quality_engine_v24b_official.py'
      - '.github/workflows/quality-engine-v24b-official.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/quality_engine_v24_static.py'
      - 'tool/tests/test_quality_engine_v24_static.py'
      - '.quality-engine-v24.json'
      - '.github/workflows/quality-engine-v24-static.yml'
      - 'tool/quality_engine_v24b_official.py'
      - 'tool/tests/test_quality_engine_v24b_official.py'
      - '.github/workflows/quality-engine-v24b-official.yml'
  schedule:
    # Best effort: does not substitute for a compiler or real Android test.
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-v24-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-static:
    name: static-review-leads
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run deterministic static code observations
        run: |
          set -euo pipefail
          python3 tool/quality_engine_v24_static.py \
            --root . --config .quality-engine-v24.json \
            --source-sha "$GITHUB_SHA" \
            --output build/quality-v24/static-analysis.json
      - name: Upload noncertifying analysis report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-v24a-static-analysis
          path: build/quality-v24/static-analysis.json
          retention-days: 14
          if-no-files-found: error
