app_name: "In Cucina con gli Anime"
project_name: "animekitchen"
package_name: "com.riccardopinato.animekitchen"
bundle_id: "com.riccardopinato.animekitchen"
version: "0.3.0+3"
platforms: [android, ios, web]
flutter_version: "3.47.3"
default_locale: en
supported_locales: [en, it, es, fr, de, pt]

brand:
  icon: "assets/branding/anime_kitchen_icon.svg"
  theme_seed: "#4A7C59"
  visual_direction: "warm watercolor-inspired editorial cooking; original assets only"

auth:
  required_at_startup: false
  google_sign_in: optional_future

persistence:
  user_state_engine: shared_preferences
  editorial_catalog: versioned_local_catalog
  authoring_source: json_build_pipeline
  local_first: true

backup:
  enabled: false
  planned: true

notifications:
  enabled: false

premium:
  enabled: true
  provider: none_yet
  contract: provider_agnostic

ads:
  enabled: false
  planned: true
  strategy: "safe adaptive banner on browse surfaces; never on active cooking flow"

web_preview:
  enabled: true
  boundary: "shared UI/navigation/content wiring only"

native_capabilities: []

content:
  imported_recipes: 0
  authoring_pipeline: implemented
  duplicate_similarity_gate: implemented
  note: "F2 ships zero real production recipes; synthetic fixture is preview/test-only."

goldens:
  - app_bootstrap
  - agent_governance
  - code_hygiene
  - theme_m3
  - localization
  - app_shell_responsive_visual_qa
  - app_icon_branding
  - ci_release_web_deploy
  - entitlement_contract
  - versioned_editorial_catalog
  - import_export_portability
  - duplicate_similarity_review_gate
  - applab_qa_certification

factory_baseline:
  repository: "riccardopinato/App-Factory-Core"
  master: "26.6"
  golden_index: "19"
  commit: "55247b294b44914dba8da6c176c9e50d5fe0e13e"
