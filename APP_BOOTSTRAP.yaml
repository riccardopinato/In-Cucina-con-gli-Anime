app_name: "In Cucina con gli Anime"
project_name: "animekitchen"
package_name: "com.riccardopinato.animekitchen"
bundle_id: "com.riccardopinato.animekitchen"
version: "0.9.0+9"
platforms: [android, ios, web]
flutter_version: "3.47.3"
default_locale: en
supported_locales: [en, it, es, fr, de, pt]

brand:
  icon: "assets/branding/anime_kitchen_icon.svg"
  theme_seed: "#4A7C59"
  visual_direction: "Japanese-contemporary editorial cookbook; procedural recipe art; original East Asian folklore mascots; rice-paper surfaces"

auth:
  required_at_startup: false
  google_sign_in: optional_future

persistence:
  user_state_engine: shared_preferences
  editorial_catalog: versioned_local_catalog
  authoring_source: json_build_pipeline
  local_first: true

backup:
  enabled: false
  planned: true

notifications:
  enabled: false

premium:
  enabled: true
  provider: in_app_purchase
  contract: provider_agnostic
  product_id: remove_ads_lifetime
  billing_enabled_by_default: false
  verification: sandbox_opt_in_only
  production_verification: pending

ads:
  enabled: false
  planned: true
  provider: none_yet
  consent_foundation: implemented
  runtime_gate: "local preference + trusted provider resolution + entitlement; fail-closed"
  strategy: "safe adaptive banner on browse surfaces; never on active cooking flow"

web_preview:
  enabled: true
  boundary: "shared UI/navigation/content wiring only"

native_capabilities: [in_app_purchase]

content:
  imported_recipes: 10
  authoring_pipeline: implemented
  duplicate_similarity_gate: implemented
  note: "F3C adds a recipe-independent decorative character registry with original procedural Japanese/Chinese folklore mascots, native float/peek/sway motion and contextual anti-repetition."

goldens:
  - app_bootstrap
  - agent_governance
  - code_hygiene
  - theme_m3
  - localization
  - app_shell_responsive_visual_qa
  - app_icon_branding
  - ci_release_web_deploy
  - entitlement_contract
  - versioned_editorial_catalog
  - import_export_portability
  - duplicate_similarity_review_gate
  - applab_qa_certification

factory_baseline:
  repository: "riccardopinato/App-Factory-Core"
  master: "26.6"
  golden_index: "19"
  commit: "55247b294b44914dba8da6c176c9e50d5fe0e13e"
